[package]
name = "smoke-break"
version = "0.1.0"
description = "A pixel-art cigarette pack that starts team smoke breaks"
edition = "2021"

[lib]
name = "smoke_break_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
# HMAC-SHA256 for per-hub client ids (src/identity.rs; HMAC itself is the few
# lines there). Already in the build through tauri-codegen.
sha2 = "0.10"

# The per-user single-instance lock (src/single_instance.rs: flock, getpeereid)
# and the user's home folder from the user database (src/user.rs). Already in
# the build through tauri and its dependencies.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Hub access tokens and the device identity in the login Keychain
# (src/token.rs). No default features: only the Keychain item API is used.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", default-features = false }

[dev-dependencies]
# Reads the meeting-link cases shared with the TypeScript tests. Already part of
# the build through tauri; not shipped in the app.
serde_json = "1"
# Tauri's mock runtime, to check which window may call which command
# (`lib.rs` tests). Only for `cargo test`: the app itself is built without it.
tauri = { version = "2", features = ["test"] }
