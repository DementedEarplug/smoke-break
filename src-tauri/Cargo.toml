[package]
name = "smoke-break"
version = "0.1.0"
description = "A pixel-art cigarette pack that starts team smoke breaks"
edition = "2021"

[lib]
name = "smoke_break_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

# Hub access tokens in the login Keychain (src/token.rs). No default features:
# only the Keychain item API is used.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", default-features = false }

[dev-dependencies]
# Reads the meeting-link cases shared with the TypeScript tests. Already part of
# the build through tauri; not shipped in the app.
serde_json = "1"
